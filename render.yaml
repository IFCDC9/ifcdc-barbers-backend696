# IFCDC Barbers — Render Web Service
# https://render.com/docs/blueprint-spec
#
# Production API host (mobile + checkout): https://ifcdc-barbers-backend696.onrender.com
# (Do NOT use ifcdc-barbers-backend.onrender.com — booking routes 404 there.)
#
# Set these in the Render dashboard (Environment) — do not commit secrets:
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET (same PayPal app — Sandbox OR Live, not mixed)
#   PAYPAL_ENV=sandbox  OR  PAYPAL_ENV=live  (MUST match the app that issued the credentials)
#   If credentials only work on live API, PAYPAL_ENV must be live (sandbox → invalid_client).
#   DATABASE_URL (Supabase / Postgres)
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER (recommended)
#   OPENAI_API_KEY, JWT_SECRET, GOOGLE_CLIENT_ID (if used)
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY (public API key)
#   HUBSPOT_SERVICE_KEY (private app token — Render dashboard only)
#   HUBSPOT_SYNC_ENABLED=1  (feature flag for contact sync)
#   HUBSPOT_SYNC_COMPANIES=1  (Phase 2A — barbershops → HubSpot Companies)
#   HUBSPOT_SYNC_DEALS=1      (Phase 2B — appointments → HubSpot Deals)
#   Optional pipeline stage IDs: HUBSPOT_DEAL_PIPELINE_ID, HUBSPOT_DEAL_STAGE_PAID,
#     HUBSPOT_DEAL_STAGE_COMPLETED, HUBSPOT_DEAL_STAGE_CANCELLED, HUBSPOT_DEAL_STAGE_NO_SHOW
#   ADMIN_SECRET (must match local .env ADMIN_SECRET / VITE_ADMIN_API_KEY for x-admin-key ops)
#
# HubSpot must ONLY be configured on this service (ifcdc-barbers-backend696).
# Do NOT set HUBSPOT_* on ifcdc-barbers-backend696-d8ui — strip with:
#   RENDER_API_KEY=rnd_... node scripts/render-strip-d8ui-hubspot.mjs --deploy
#
# Optional: PUBLIC_BASE_URL=https://<your-service>.onrender.com
# (If unset, the app uses RENDER_EXTERNAL_URL from Render automatically.)

services:
  # Production API — mobile TestFlight + web checkout (must auto-deploy from main)
  - type: web
    name: ifcdc-barbers-backend696
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && git rev-parse HEAD > DEPLOY_COMMIT.txt
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Invite emails + public links (SPA). Render fallback if custom domain is down.
      - key: FRONTEND_URL
        value: https://ifcdcbarbersapp.com
      - key: PUBLIC_WEB_FALLBACK_URL
        value: https://ifcdc-barbers-frontend.onrender.com
      # Photo persistence — set URL + service role in Render dashboard (Dashboard → API keys)
      - key: SUPABASE_STORAGE_BUCKET
        value: barber-styles
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # HubSpot Phase 1 — values set only in Render dashboard (never commit secrets)
      - key: HUBSPOT_SERVICE_KEY
        sync: false
      - key: HUBSPOT_SYNC_ENABLED
        sync: false
      - key: HUBSPOT_SYNC_COMPANIES
        sync: false
      - key: HUBSPOT_SYNC_DEALS
        sync: false

  # AURA / Twilio voice + chat API — same Node backend as backend696 (repo root), NOT client/
  # Twilio webhooks: set PUBLIC_BASE_URL to this service URL (e.g. https://aura-backend.onrender.com)
  - type: web
    name: aura-backend
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/aura/status
    buildFilter:
      paths:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.ts"
        - package.json
        - package-lock.json
      ignoredPaths:
        - client/**
        - mobile/**
        - frontend/**
        - docs/**
        - scripts/capture-asc-screenshots.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_VITE_ENV_VALIDATION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: JWT_SECRET
        sync: false

  # 30-day follow-up push reminders run inside the web service (setInterval every 6h on boot).
  # Do NOT add a separate cron service unless you copy DATABASE_URL + push env vars to it in Render.
  # In-app: Profile → "30-day haircut updates" (HaircutFollowupScreen).

  # Frontend (Render Static Site) — SPA rewrite required for deep links like /invite
  - type: web
    name: ifcdc-barbers-frontend
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the frontend at the production API (set/override in dashboard if needed).
      - key: VITE_API_BASE
        value: https://ifcdc-barbers-backend696.onrender.com
      # Required for PayPal buttons (must match backend PAYPAL_CLIENT_ID — Live app).
      # - key: VITE_PAYPAL_CLIENT_ID
      #   sync: false
      - key: VITE_PAYPAL_ENVIRONMENT
        value: production
      - key: VITE_PLATFORM_FEE
        value: "0.99"
