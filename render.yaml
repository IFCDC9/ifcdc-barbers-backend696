# IFCDC Barbers — Render Web Service
# https://render.com/docs/blueprint-spec
#
# Production API host (mobile + checkout): https://ifcdc-barbers-backend696.onrender.com
# (Do NOT use ifcdc-barbers-backend.onrender.com — booking routes 404 there.)
#
# Set these in the Render dashboard (Environment) — do not commit secrets:
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET (same PayPal app — Sandbox OR Live, not mixed)
#   PAYPAL_ENV=sandbox  OR  PAYPAL_ENV=live  (MUST match the app that issued the credentials)
#   If credentials only work on live API, PAYPAL_ENV must be live (sandbox → invalid_client).
#   DATABASE_URL (Supabase / Postgres)
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER (recommended)
#   OPENAI_API_KEY, JWT_SECRET, GOOGLE_CLIENT_ID (if used)
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY (public API key)
#   SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY (server-only)
#
# Optional: PUBLIC_BASE_URL=https://<your-service>.onrender.com
# (If unset, the app uses RENDER_EXTERNAL_URL from Render automatically.)

services:
  # Frontend (Render Static Site) — SPA rewrite required for deep links like /invite
  - type: web
    name: ifcdc-barbers-frontend
    runtime: static
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the frontend at the production API (set/override in dashboard if needed).
      - key: VITE_API_BASE
        value: https://ifcdc-barbers-backend696.onrender.com

  - type: web
    name: ifcdc-barbers-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      # Skip Vite-related env checks on backend-only hosts (set required keys in dashboard).
      - key: SKIP_VITE_ENV_VALIDATION
        value: "true"
      # Lets the process boot if strict validation would exit(1) before listen (fix dashboard env, then set to 0).
      - key: IFCDC_SKIP_STRICT_ENV
        value: "1"
      # Invite emails must use the public web app origin (never the API host).
      - key: FRONTEND_URL
        value: https://ifcdcbarbersapp.com
      # Set ADMIN_SECRET, DATABASE_URL, Supabase keys, Twilio, OPENAI in the Render dashboard.
      - key: SUPABASE_STORAGE_BUCKET
        value: barber-styles
